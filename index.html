<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./src/assets/F-Dash — Logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Personal dashboard for freelance web development — finance, projects, analytics, and goals."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Finance Dashboard</title>
    <style>
      html, body { min-height: 100%; background: #f7f7ff; }
      .fd-boot { min-height: 100vh; display: flex; background: #f7f7ff; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .fd-boot__main { flex: 1; min-width: 0; }
      .fd-boot__top { height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 32px; border-bottom: 1px solid #e3e0ee; }
      .fd-boot__content { padding: 28px 32px; }
      .fd-boot__line { display: block; border-radius: 7px; background: linear-gradient(100deg, #e7e3f2 20%, #f8f6fd 48%, #e7e3f2 78%); background-size: 220% 100%; animation: fd-boot-shimmer 1.6s linear infinite; }
      .fd-boot__top .fd-boot__line:first-child { width: 120px; height: 22px; }
      .fd-boot__top .fd-boot__line:last-child { width: 170px; height: 12px; }
      .fd-boot__heading { width: 190px; height: 16px; margin-bottom: 20px; }
      .fd-boot__stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
      .fd-boot__stat, .fd-boot__panel { border: 1px solid #e4e0ed; border-radius: 13px; background: #fff; }
      .fd-boot__stat { height: 105px; padding: 18px; }
      .fd-boot__stat .fd-boot__line:first-child { width: 90px; height: 10px; margin-bottom: 14px; }
      .fd-boot__stat .fd-boot__line:last-child { width: 120px; height: 25px; }
      .fd-boot__panel { min-height: 300px; padding: 18px; }
      .fd-boot__panel > .fd-boot__line { width: 160px; height: 15px; margin-bottom: 24px; }
      .fd-boot__row { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid #eeeaf5; }
      .fd-boot__row .fd-boot__line:first-child { width: 30px; height: 30px; border-radius: 9px; }
      .fd-boot__row .fd-boot__line:last-child { width: min(50%, 280px); height: 11px; }
      @keyframes fd-boot-shimmer { to { background-position-x: -220%; } }
      @media (max-width: 768px) { .fd-boot__top { padding: 0 16px; } .fd-boot__content { padding: 20px 16px; } .fd-boot__stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .fd-boot__stat:last-child { display: none; } }
      @media (prefers-reduced-motion: reduce) { .fd-boot__line { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="fd-boot" role="status" aria-label="Loading dashboard"><div class="fd-boot__main"><div class="fd-boot__top"><span class="fd-boot__line"></span><span class="fd-boot__line"></span></div><div class="fd-boot__content"><span class="fd-boot__line fd-boot__heading"></span><div class="fd-boot__stats"><div class="fd-boot__stat"><span class="fd-boot__line"></span><span class="fd-boot__line"></span></div><div class="fd-boot__stat"><span class="fd-boot__line"></span><span class="fd-boot__line"></span></div><div class="fd-boot__stat"><span class="fd-boot__line"></span><span class="fd-boot__line"></span></div></div><div class="fd-boot__panel"><span class="fd-boot__line"></span><div class="fd-boot__row"><span class="fd-boot__line"></span><span class="fd-boot__line"></span></div><div class="fd-boot__row"><span class="fd-boot__line"></span><span class="fd-boot__line"></span></div><div class="fd-boot__row"><span class="fd-boot__line"></span><span class="fd-boot__line"></span></div></div></div></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
